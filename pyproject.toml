[project]
name = "shanten-sensei"
version = "0.1.1"
description = "AI coach that explains Mortal's riichi recommendations in plain English"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mahjong>=1.2",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/rclarke009/shanten_sensei"
Repository = "https://github.com/rclarke009/shanten_sensei"
Documentation = "https://github.com/rclarke009/shanten_sensei/blob/main/docs/install-mac.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sensei = "shanten_sensei.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shanten_sensei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["eval: screenshot/template regression (copy-sensitive)"]
